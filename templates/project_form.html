{% extends 'base.html' %}{% from 'macros.html' import csrf with context %}
{% block content %}<a class="back" href="{{ url_for('projects.project_detail', project_id=project.id) if project else url_for('projects.index') }}">← Back</a><div class="form-card"><h1>{{ 'Edit project' if project else 'New project' }}</h1><form method="post">{{ csrf() }}<label for="name">Project name</label><input id="name" name="name" maxlength="200" required value="{{ project.name if project else '' }}"><label for="description">Description</label><textarea id="description" name="description" maxlength="10000" rows="6">{{ project.description if project else '' }}</textarea><button type="submit">Save project</button></form></div>{% endblock %}
