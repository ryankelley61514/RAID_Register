{% extends 'base.html' %}{% from 'macros.html' import csrf with context %}
{% block content %}<a class="back" href="{{ url_for('projects.project_detail', project_id=project.id) }}">← {{ project.name }}</a><div class="form-card"><h1>{{ 'Edit changelog entry' if entry else 'New changelog entry' }}</h1><form method="post">{{ csrf() }}<label for="title">Title</label><input id="title" name="title" required maxlength="200" value="{{ entry.title if entry else '' }}"><label for="body">What changed?</label><textarea id="body" name="body" rows="8" maxlength="10000">{{ entry.body if entry else '' }}</textarea><button type="submit">Save entry</button></form></div>{% endblock %}
